name: Health Monitor TestFlight Release

on:
  workflow_dispatch:
    inputs:
      confirm_upload:
        description: "I confirm this build should be uploaded to TestFlight"
        required: true
        default: false
        type: boolean
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "1.0"
        type: string
      build_number:
        description: "Optional CFBundleVersion. Leave blank to use 1000 + workflow run number."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: health-monitor-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ inputs.confirm_upload }}
    runs-on: macos-26
    timeout-minutes: 45

    env:
      APP_BUNDLE_ID: com.bom.healthmonitor
      WATCH_BUNDLE_ID: com.bom.healthmonitor.watchapp
      MIN_XCODEGEN_VERSION: "2.46.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_TEAM_ID \
            APPLE_DISTRIBUTION_CERT_P12_BASE64 \
            APPLE_DISTRIBUTION_CERT_PASSWORD \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_P8_BASE64
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Environment
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          swift --version

      - name: Verify source and privacy surface
        run: |
          set -euo pipefail
          if [ -f scripts/verify_source_integrity.py ] && [ -f SOURCE_INTEGRITY.json ]; then
            python3 scripts/verify_source_integrity.py
          fi
          python3 scripts/verify_database_manager_structure.py
          python3 scripts/verify_privacy_surface.py
          plutil -lint HealthMonitor/PrivacyInfo.xcprivacy

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          python3 - <<'PY'
          import os, re, subprocess
          text = subprocess.check_output(["xcodegen", "--version"], text=True)
          match = re.search(r"(\d+)\.(\d+)\.(\d+)", text)
          if not match:
              raise SystemExit(f"Could not parse XcodeGen version: {text!r}")
          actual = tuple(map(int, match.groups()))
          minimum = tuple(map(int, os.environ["MIN_XCODEGEN_VERSION"].split(".")))
          if actual < minimum:
              raise SystemExit(f"XcodeGen {actual} is older than required {minimum}")
          print(f"PASS: XcodeGen {actual} >= {minimum}")
          PY

      - name: Generate and verify Xcode project
        run: |
          set -euo pipefail
          rm -rf HealthMonitor.xcodeproj
          xcodegen generate
          python3 scripts/verify_generated_project.py

      - name: Resolve release version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          set -euo pipefail

          version="$INPUT_MARKETING_VERSION"
          if ! [[ "$version" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]; then
            echo "::error::marketing_version must look like 1.0 or 1.0.1"
            exit 1
          fi

          build="$INPUT_BUILD_NUMBER"
          if [ -z "$build" ]; then
            build="$((1000 + GITHUB_RUN_NUMBER))"
          fi
          if ! [[ "$build" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must contain digits only"
            exit 1
          fi

          echo "RELEASE_MARKETING_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "Release version: $version ($build)"

      - name: Install Apple signing certificate and API key
        env:
          CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          ASC_KEY_B64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/health-monitor-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/health-monitor-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          ASC_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          ASC_KEY_PATH="$ASC_KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"

          export CERT_PATH ASC_KEY_PATH CERT_B64 ASC_KEY_B64
          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["CERT_PATH"]).write_bytes(
              base64.b64decode(os.environ["CERT_B64"], validate=True)
          )
          pathlib.Path(os.environ["ASC_KEY_PATH"]).parent.mkdir(
              parents=True, exist_ok=True
          )
          pathlib.Path(os.environ["ASC_KEY_PATH"]).write_bytes(
              base64.b64decode(os.environ["ASC_KEY_B64"], validate=True)
          )
          PY

          chmod 600 "$ASC_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          echo "$identities"
          echo "$identities" | grep -q "Apple Distribution"

          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_CERT_PATH=$CERT_PATH" >> "$GITHUB_ENV"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive signed Release build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          rm -rf build/TestFlight.xcarchive build/TestFlightDerivedData

          xcodebuild \
            -project HealthMonitor.xcodeproj \
            -scheme HealthMonitor \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TestFlight.xcarchive \
            -derivedDataPath build/TestFlightDerivedData \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$RELEASE_MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$RELEASE_BUILD_NUMBER" \
            archive | tee testflight-archive.log

      - name: Verify signed archive
        run: |
          set -euo pipefail
          APP="build/TestFlight.xcarchive/Products/Applications/HealthMonitor.app"
          WATCH="$APP/PlugIns/HealthMonitorWatch.app"

          test -d "$APP"
          test -d "$WATCH"
          test -f "$APP/PrivacyInfo.xcprivacy"

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP" > ios-entitlements.plist
          codesign -d --entitlements :- "$WATCH" > watch-entitlements.plist

          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" ios-entitlements.plist | grep -Fx true
          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.healthkit" watch-entitlements.plist | grep -Fx true

          ios_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          watch_id=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$WATCH/Info.plist")
          test "$ios_id" = "$APP_BUNDLE_ID"
          test "$watch_id" = "$WATCH_BUNDLE_ID"

          ios_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          ios_build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          test "$ios_version" = "$RELEASE_MARKETING_VERSION"
          test "$ios_build" = "$RELEASE_BUILD_NUMBER"

      - name: Create App Store Connect export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export signed IPA
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          rm -rf build/TestFlightExport
          mkdir -p build/TestFlightExport

          xcodebuild \
            -exportArchive \
            -archivePath build/TestFlight.xcarchive \
            -exportPath build/TestFlightExport \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee testflight-export.log

          IPA_PATH="$(find build/TestFlightExport -maxdepth 2 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          test -f "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

          unzip -l "$IPA_PATH" | grep -q "HealthMonitorWatch.app/"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            | tee testflight-upload.log

      - name: Release summary
        if: always()
        run: |
          {
            echo "## Health Monitor TestFlight"
            echo ""
            echo "- Version: ${RELEASE_MARKETING_VERSION:-not-built}"
            echo "- Build: ${RELEASE_BUILD_NUMBER:-not-built}"
            echo "- Bundle ID: $APP_BUNDLE_ID"
            echo "- Watch bundle ID: $WATCH_BUNDLE_ID"
            echo "- Xcode: $(xcodebuild -version | head -1)"
            echo "- Upload was manual-only and required confirm_upload=true."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing material
        if: always()
        run: |
          set +e
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH"
          fi
          rm -f "${SIGNING_CERT_PATH:-}"
          rm -f "${ASC_KEY_PATH:-}"
          rm -f "$RUNNER_TEMP/ExportOptions.plist"
