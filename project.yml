name: HealthMonitor
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
    watchOS: '10.0'
  postGenCommand: python3 scripts/patch_xcode26_watch_embed.py
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: '17'
    MARKETING_VERSION: '1.0'
    CODE_SIGN_STYLE: Automatic
targets:
  HealthMonitor:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    configFiles:
      Debug: Config/BundleIds.xcconfig
      Release: Config/BundleIds.xcconfig
    sources:
    - path: HealthMonitor
      excludes:
      - Info.plist
      - HealthMonitor.entitlements
      - PrivacyInfo.xcprivacy
    - path: Shared
    - path: HealthMonitor/PrivacyInfo.xcprivacy
      buildPhase: resources
    info:
      path: HealthMonitor/Info.plist
    entitlements:
      path: HealthMonitor/HealthMonitor.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMONITOR_BUNDLE_ID)
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: '1'
        SUPPORTS_MACCATALYST: 'NO'
        GENERATE_INFOPLIST_FILE: 'NO'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
    dependencies:
    - target: HealthMonitorWatch
      embed: true
    - sdk: HealthKit.framework
    - sdk: WatchConnectivity.framework
    - sdk: LocalAuthentication.framework
    - sdk: libsqlite3.tbd
    scheme:
      gatherCoverageData: true
      testTargets:
      - HealthMonitorTests
  HealthMonitorWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    configFiles:
      Debug: Config/BundleIds.xcconfig
      Release: Config/BundleIds.xcconfig
    sources:
    - path: HealthMonitorWatch
      excludes:
      - Info.plist
      - HealthMonitorWatch.entitlements
    - path: Shared
    info:
      path: HealthMonitorWatch/Info.plist
    entitlements:
      path: HealthMonitorWatch/HealthMonitorWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMONITOR_WATCH_BUNDLE_ID)
        PRODUCT_NAME: $(TARGET_NAME)
        TARGETED_DEVICE_FAMILY: '4'
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: watchos watchsimulator
        SKIP_INSTALL: 'YES'
        GENERATE_INFOPLIST_FILE: 'NO'
        SWIFT_EMIT_LOC_STRINGS: 'YES'
    dependencies:
    - sdk: HealthKit.framework
    - sdk: WatchConnectivity.framework
    - sdk: WatchKit.framework
  HealthMonitorTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: HealthMonitorTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHMONITOR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: 'YES'
        SWIFT_VERSION: '5.0'
    dependencies:
    - target: HealthMonitor
